name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Lint & Smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create local config
        run: make setup

      - name: Biome lint
        run: make lint

      - name: Boot server and hit the pages
        run: |
          # No SurrealDB in CI: the server must still serve from memory.
          PORT=3010 bun src/server/index.js &
          for i in $(seq 1 30); do curl -sf localhost:3010/ >/dev/null && break; sleep 1; done
          for path in / /privacidade /css/aero.css /js/app.js /api/states "/ui/state?uf=ba"; do
            curl -sf -o /dev/null "localhost:3010$path" || { echo "FAIL $path"; exit 1; }
          done
